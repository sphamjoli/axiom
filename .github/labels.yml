# Type labels
- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality"
- name: "type: chore"
  color: "fef2c0"
  description: "Maintenance, refactoring, deps, CI"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation changes"
- name: "type: refactor"
  color: "d4c5f9"
  description: "Code restructuring without behaviour change"
- name: "type: perf"
  color: "fbca04"
  description: "Performance improvement"

# Component labels
- name: "component: engine"
  color: "c5def5"
  description: "Untrusted Rust analysis engine (language, inference, circuits, certificates)"
- name: "component: checker"
  color: "c5def5"
  description: "Lean 4 certificate checker and formal semantics"
- name: "component: docs"
  color: "c5def5"
  description: "README and design documentation"
- name: "infra"
  color: "e6e6e6"
  description: "CI, hooks, build config, tooling"
- name: "tcb"
  color: "5319e7"
  description: "Changes the trusted computing base"

# Priority labels
- name: "P0"
  color: "b60205"
  description: "Critical, blocks progress"
- name: "P1"
  color: "d93f0b"
  description: "High priority"
- name: "P2"
  color: "fbca04"
  description: "Normal priority"

# Status labels
- name: "blocked"
  color: "e4e669"
  description: "Blocked by an external dependency"
- name: "needs-info"
  color: "d876e3"
  description: "Waiting for more information"
- name: "duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be addressed"
