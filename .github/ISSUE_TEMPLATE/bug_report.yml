name: Bug report
description: Report incorrect behaviour in the engine, the checker, or tooling.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: State the incorrect behaviour directly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, the input model, and any certificate involved.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, rustc version, Lean toolchain.
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Verbatim command output or verdicts.
      render: shell
