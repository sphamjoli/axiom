name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel; rustup on the runner installs it
      # on first use, so no toolchain action is needed.
      - name: Check formatting
        run: make rust-fmt

  rust:
    name: rust (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: make rust-lint
      - name: Tests
        # The tests that run the Lean checker need lake; the lean job runs them.
        run: make rust-test-without-lean

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build docs
        run: make rust-doc

  lean:
    name: lean (checker build, tests, axiom audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Textual pre-check for forbidden constructs
        run: make lean-check
      # lean-action installs elan from lean/lean-toolchain, restores the
      # .lake cache, fetches prebuilt mathlib oleans, and runs `lake build`.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
      - name: Checker tests against the shared fixtures
        run: ./scripts/testLean.sh
      - name: Kernel axiom audit
        run: ./scripts/checkLeanAxioms.sh
      - name: axiom check through the Lean checker
        run: make cli-lean-test

  engine:
    name: engine proofs (proof 3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Covered functions stay in the translatable subset
        run: ./scripts/checkProof3.sh
      # Fetches the Charon and Aeneas release pinned in proof3.toml, verified
      # against the SHA-256 in the script, and the Rust nightly Charon drives.
      - name: Install the pinned Charon and Aeneas
        run: ./scripts/installAeneas.sh
      - name: Regenerated Lean equals the committed translation
        run: ./scripts/checkProof3.sh --translate
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean-engine
          use-mathlib-cache: true
      - name: Engine proofs build and use only the standard axioms
        run: ./scripts/checkEngine.sh

  gates:
    name: source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install gate dependencies
        run: bun install --frozen-lockfile
      - name: Decorative separators
        run: bun scripts/checkDecorativeSeparators.mjs
      - name: Trailing comments
        run: bun scripts/checkTrailingComments.mjs
      - name: Markdown wrap
        run: bun scripts/checkMarkdownWrap.mjs

  ui:
    name: ui (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The interface runs the engine compiled to WebAssembly. wasm-bindgen-cli
      # must match the wasm-bindgen version pinned in crates/axiom-wasm.
      - name: Install the WebAssembly target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version =0.2.130 --locked
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  ci:
    name: CI summary
    if: ${{ always() }}
    needs: [fmt, rust, docs, lean, engine, gates, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| rustfmt | ${FMT_RESULT} |"
            echo "| rust | ${RUST_RESULT} |"
            echo "| rustdoc | ${DOCS_RESULT} |"
            echo "| lean | ${LEAN_RESULT} |"
            echo "| engine proofs | ${ENGINE_RESULT} |"
            echo "| source gates | ${GATES_RESULT} |"
            echo "| ui | ${UI_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required check did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required checks failed." >&2
          exit 1
