name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the channel; rustup on the runner installs it
      # on first use, so no toolchain action is needed.
      - name: Check formatting
        run: make rust-fmt

  rust:
    name: rust (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: make rust-lint
      - name: Tests
        run: make rust-test

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build docs
        run: make rust-doc

  lean:
    name: lean (checker build, axiom audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Textual pre-check for forbidden constructs
        run: make lean-check
      # lean-action installs elan from lean/lean-toolchain, restores the
      # .lake cache, fetches prebuilt mathlib oleans, and runs `lake build`.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
      - name: Kernel axiom audit
        run: ./scripts/checkLeanAxioms.sh

  gates:
    name: source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install gate dependencies
        run: bun install --frozen-lockfile
      - name: Decorative separators
        run: bun scripts/checkDecorativeSeparators.mjs
      - name: Trailing comments
        run: bun scripts/checkTrailingComments.mjs
      - name: Markdown wrap
        run: bun scripts/checkMarkdownWrap.mjs

  ci:
    name: CI summary
    if: ${{ always() }}
    needs: [fmt, rust, docs, lean, gates]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          FMT_RESULT: ${{ needs.fmt.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          GATES_RESULT: ${{ needs.gates.result }}
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Check | Result |"
            echo "| ----- | ------ |"
            echo "| rustfmt | ${FMT_RESULT} |"
            echo "| rust | ${RUST_RESULT} |"
            echo "| rustdoc | ${DOCS_RESULT} |"
            echo "| lean | ${LEAN_RESULT} |"
            echo "| source gates | ${GATES_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any required check did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more required checks failed." >&2
          exit 1
