name = "AxiomCheck"
version = "0.1.0"
defaultTargets = ["AxiomCheck"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true
linter.missingDocs = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.19.0"

[[lean_lib]]
name = "AxiomCheck"
moreLeanArgs = ["-DwarningAsError=true"]
