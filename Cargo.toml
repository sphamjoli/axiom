# axiom-core must not depend on any other workspace crate.
[workspace]
resolver = "3"
members = ["crates/axiom-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
num-bigint = { version = "0.4.6" }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint-std", "std"] }
num-traits = { version = "0.2.19" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.17" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
