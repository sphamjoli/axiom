# axiom-core must not depend on any other workspace crate; axiom-cert and
# axiom-model may each depend only on axiom-core; axiom-cli may depend on
# any of them.
[workspace]
resolver = "3"
members = ["crates/axiom-core", "crates/axiom-cert", "crates/axiom-model", "crates/axiom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
axiom-core = { path = "crates/axiom-core", version = "0.1.0" }
axiom-cert = { path = "crates/axiom-cert", version = "0.1.0" }
axiom-model = { path = "crates/axiom-model", version = "0.1.0" }
num-bigint = { version = "0.4.6" }
num-rational = { version = "0.4.2", default-features = false, features = ["num-bigint-std", "std"] }
num-traits = { version = "0.2.19" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0.17" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
